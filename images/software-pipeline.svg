<svg width="560" height="130" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="280" y="14" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">Java Stream Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Row 1: File -> lines -> flatMap(tokenize) -> map(normalize) -->
  <!-- Row 2: filter -> distinct -> sorted -> collect -->

  <!-- Box helper: each box 62px wide, 30px tall, spaced 72px apart -->
  <!-- Row 1 y=30, Row 2 y=82 -->

  <!-- File -->
  <rect x="10" y="30" width="62" height="30" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="41" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#14532d">File</text>

  <line x1="72" y1="45" x2="84" y2="45" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- lines() -->
  <rect x="84" y="30" width="62" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="115" y="50" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e3a8a">lines()</text>

  <line x1="146" y1="45" x2="158" y2="45" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- flatMap -->
  <rect x="158" y="30" width="76" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="196" y="49" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3a8a">flatMap</text>
  <text x="196" y="58" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b7280">(tokenize)</text>

  <line x1="234" y1="45" x2="246" y2="45" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- map -->
  <rect x="246" y="30" width="76" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="284" y="49" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3a8a">map</text>
  <text x="284" y="58" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#6b7280">(normalize)</text>

  <!-- Arrow turning down to row 2 -->
  <line x1="322" y1="45" x2="350" y2="45" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="350" y1="45" x2="350" y2="97" stroke="#2563eb" stroke-width="1.3"/>
  <line x1="350" y1="97" x2="338" y2="97" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- filter -->
  <rect x="264" y="82" width="74" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="301" y="102" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e3a8a">filter</text>

  <line x1="264" y1="97" x2="252" y2="97" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- distinct -->
  <rect x="188" y="82" width="64" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="220" y="102" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e3a8a">distinct</text>

  <line x1="188" y1="97" x2="176" y2="97" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- sorted -->
  <rect x="112" y="82" width="64" height="30" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="144" y="102" text-anchor="middle" font-family="monospace" font-size="10" fill="#1e3a8a">sorted</text>

  <line x1="112" y1="97" x2="100" y2="97" stroke="#2563eb" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- collect -->
  <rect x="26" y="82" width="74" height="30" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="63" y="102" text-anchor="middle" font-family="monospace" font-size="10" fill="#14532d">collect</text>

  <!-- Input/output labels -->
  <text x="41" y="125" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#9ca3af">result</text>
  <text x="10" y="52" font-family="sans-serif" font-size="9" fill="#9ca3af">input</text>
</svg>
