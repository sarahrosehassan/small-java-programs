<svg width="566" height="175" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="283" y="14" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">World Time Zones (UTC Offsets)</text>

  <!-- 25 bars: UTC-12 to UTC+12, each 21px wide, starting x=10 -->
  <!-- Colors transition blue -> green -> orange -> red -->

  <!-- UTC-12 --> <rect x="10"  y="22" width="21" height="80" rx="0" fill="#1e3a8a"/>
  <!-- UTC-11 --> <rect x="31"  y="22" width="21" height="80" fill="#1d4ed8"/>
  <!-- UTC-10 --> <rect x="52"  y="22" width="21" height="80" fill="#2563eb"/>
  <!-- UTC-9  --> <rect x="73"  y="22" width="21" height="80" fill="#3b82f6"/>
  <!-- UTC-8  --> <rect x="94"  y="22" width="21" height="80" fill="#60a5fa"/>
  <!-- UTC-7  --> <rect x="115" y="22" width="21" height="80" fill="#7dd3fc"/>
  <!-- UTC-6  --> <rect x="136" y="22" width="21" height="80" fill="#6ee7b7"/>
  <!-- UTC-5  --> <rect x="157" y="22" width="21" height="80" fill="#34d399"/>
  <!-- UTC-4  --> <rect x="178" y="22" width="21" height="80" fill="#10b981"/>
  <!-- UTC-3  --> <rect x="199" y="22" width="21" height="80" fill="#059669"/>
  <!-- UTC-2  --> <rect x="220" y="22" width="21" height="80" fill="#16a34a"/>
  <!-- UTC-1  --> <rect x="241" y="22" width="21" height="80" fill="#65a30d"/>

  <!-- UTC+0 (highlighted) -->
  <rect x="262" y="18" width="21" height="88" rx="2" fill="#15803d" stroke="#166534" stroke-width="2"/>

  <!-- UTC+1  --> <rect x="283" y="22" width="21" height="80" fill="#ca8a04"/>
  <!-- UTC+2  --> <rect x="304" y="22" width="21" height="80" fill="#d97706"/>
  <!-- UTC+3  --> <rect x="325" y="22" width="21" height="80" fill="#ea580c"/>
  <!-- UTC+4  --> <rect x="346" y="22" width="21" height="80" fill="#f97316"/>
  <!-- UTC+5  --> <rect x="367" y="22" width="21" height="80" fill="#ef4444"/>
  <!-- UTC+6  --> <rect x="388" y="22" width="21" height="80" fill="#dc2626"/>
  <!-- UTC+7  --> <rect x="409" y="22" width="21" height="80" fill="#c2410c"/>
  <!-- UTC+8  --> <rect x="430" y="22" width="21" height="80" fill="#b91c1c"/>
  <!-- UTC+9  --> <rect x="451" y="22" width="21" height="80" fill="#991b1b"/>
  <!-- UTC+10 --> <rect x="472" y="22" width="21" height="80" fill="#7f1d1d"/>
  <!-- UTC+11 --> <rect x="493" y="22" width="21" height="80" fill="#6b1414"/>
  <!-- UTC+12 --> <rect x="514" y="22" width="21" height="80" fill="#4c1010"/>

  <!-- UTC offset labels (every 3) -->
  <text x="20"  y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#374151">-12</text>
  <text x="73"  y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#374151">-9</text>
  <text x="136" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#374151">-6</text>
  <text x="167" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#374151">-5</text>
  <text x="272" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#166534" font-weight="bold">UTC</text>
  <text x="272" y="130" text-anchor="middle" font-family="monospace" font-size="9" fill="#166534" font-weight="bold">+0</text>
  <text x="346" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#374151">+4</text>
  <text x="451" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#374151">+9</text>
  <text x="535" y="118" text-anchor="middle" font-family="monospace" font-size="8" fill="#374151">+12</text>

  <!-- City labels with tick marks -->
  <!-- New York UTC-5: x=167 -->
  <line x1="167" y1="102" x2="167" y2="138" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="167" y="147" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#374151">New York</text>
  <text x="167" y="156" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#6b7280">UTC-5</text>

  <!-- London UTC+0: x=272 -->
  <line x1="272" y1="106" x2="272" y2="138" stroke="#166534" stroke-width="1.2" stroke-dasharray="2,2"/>
  <text x="272" y="147" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#166534">London</text>

  <!-- Dubai UTC+4: x=346 -->
  <line x1="346" y1="102" x2="346" y2="138" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="346" y="147" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#374151">Dubai</text>
  <text x="346" y="156" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#6b7280">UTC+4</text>

  <!-- Tokyo UTC+9: x=451 -->
  <line x1="451" y1="102" x2="451" y2="138" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="451" y="147" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#374151">Tokyo</text>
  <text x="451" y="156" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#6b7280">UTC+9</text>

  <!-- West/East labels -->
  <text x="10" y="170" font-family="sans-serif" font-size="9" fill="#9ca3af">West</text>
  <text x="527" y="170" text-anchor="end" font-family="sans-serif" font-size="9" fill="#9ca3af">East</text>
</svg>
