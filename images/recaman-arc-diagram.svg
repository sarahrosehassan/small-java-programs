<svg width="430" height="170" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="215" y="15" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">Recaman Sequence: 0, 1, 3, 6, 2, 7, 13, 20</text>

  <!-- Number line -->
  <line x1="20" y1="95" x2="410" y2="95" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Tick marks and labels at sequence positions -->
  <!-- x_screen = 20 + n*19, baseline y=95 -->
  <!-- 0: x=20, 1: x=39, 2: x=58, 3: x=77, 6: x=134, 7: x=153, 13: x=267, 20: x=400 -->

  <line x1="20" y1="90" x2="20" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <text x="20" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">0</text>

  <line x1="39" y1="90" x2="39" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <text x="39" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">1</text>

  <line x1="58" y1="90" x2="58" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <text x="58" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">2</text>

  <line x1="77" y1="90" x2="77" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <text x="77" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">3</text>

  <line x1="134" y1="90" x2="134" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <text x="134" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">6</text>

  <line x1="153" y1="90" x2="153" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <text x="153" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">7</text>

  <line x1="267" y1="90" x2="267" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <text x="267" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">13</text>

  <line x1="400" y1="90" x2="400" y2="100" stroke="#6b7280" stroke-width="1.5"/>
  <text x="400" y="112" text-anchor="middle" font-family="monospace" font-size="10" fill="#374151">20</text>

  <!-- Step labels -->
  <text x="30" y="125" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">a(1)</text>
  <text x="58" y="125" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">a(2)</text>
  <text x="77" y="125" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">a(3)</text>
  <text x="96" y="125" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#dc2626">a(4)</text>
  <text x="153" y="125" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">a(5)</text>
  <text x="210" y="125" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">a(6)</text>
  <text x="333" y="125" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#9ca3af">a(7)</text>

  <!-- Arcs (above = rightward, below = leftward) -->
  <!-- All use sweep-flag=0 (CCW): rightward goes above, leftward goes below -->

  <!-- a(0)->a(1): 0->1, r=9.5, above -->
  <path d="M 20,95 A 9.5,9.5 0 0,0 39,95" fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- a(1)->a(2): 1->3, r=19, above -->
  <path d="M 39,95 A 19,19 0 0,0 77,95" fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- a(2)->a(3): 3->6, r=28.5, above -->
  <path d="M 77,95 A 28.5,28.5 0 0,0 134,95" fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- a(3)->a(4): 6->2, r=38, below (leftward, CCW goes below) -->
  <path d="M 134,95 A 38,38 0 0,0 58,95" fill="none" stroke="#dc2626" stroke-width="1.8"/>

  <!-- a(4)->a(5): 2->7, r=47.5, above -->
  <path d="M 58,95 A 47.5,47.5 0 0,0 153,95" fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- a(5)->a(6): 7->13, r=57, above -->
  <path d="M 153,95 A 57,57 0 0,0 267,95" fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- a(6)->a(7): 13->20, r=66.5, above -->
  <path d="M 267,95 A 66.5,66.5 0 0,0 400,95" fill="none" stroke="#2563eb" stroke-width="1.8"/>

  <!-- Legend -->
  <line x1="20" y1="152" x2="50" y2="152" stroke="#2563eb" stroke-width="1.8"/>
  <text x="55" y="156" font-family="sans-serif" font-size="10" fill="#374151">rightward (+n)</text>
  <line x1="160" y1="152" x2="190" y2="152" stroke="#dc2626" stroke-width="1.8"/>
  <text x="195" y="156" font-family="sans-serif" font-size="10" fill="#374151">leftward (-n, already seen)</text>
</svg>
